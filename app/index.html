<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-container">
            <div class="logo">
                <img src="https://static-assets-web.flixcart.com/fk-p-linchpin-web/fk-cp-zion/img/flipkart-plus_8d85f4.png" alt="Flipkart">
                <p>Explore <span>Plus</span></p>
            </div>
            <div class="search-bar">
                <input type="text" placeholder="Search for products, brands and more">
                <button><i class="fas fa-search"></i></button>
            </div>
            <div class="nav-links">
                <button class="login-btn">Login</button>
                <a href="#">Become a Seller</a>
                <a href="#">More <i class="fas fa-angle-down"></i></a>
                <a href="#"><i class="fas fa-shopping-cart"></i> Cart</a>
            </div>
        </div>
    </header>

    <main class="content">
        <section class="product-row">
            <div class="row-header">
                <h2>Best of Electronics</h2>
                <button class="view-all">VIEW ALL</button>
            </div>
            <div class="product-grid">
                <div class="product-card">
                    <img src="https://via.placeholder.com/150" alt="Product">
                    <p class="name">Wireless Headphones</p>
                    <p class="offer">From ₹999</p>
                    <p class="brand">Sony, JBL & more</p>
                </div>
                <div class="product-card">
                    <img src="https://via.placeholder.com/150" alt="Product">
                    <p class="name">Smart Watches</p>
                    <p class="offer">Up to 70% Off</p>
                    <p class="brand">Apple & Samsung</p>
                </div>
                <div class="product-card">
                    <img src="https://via.placeholder.com/150" alt="Product">
                    <p class="name">Top Cameras</p>
                    <p class="offer">Shop Now!</p>
                    <p class="brand">Canon, Nikon</p>
                </div>
                <div class="product-card">
                    <img src="https://via.placeholder.com/150" alt="Product">
                    <p class="name">Laptops</p>
                    <p class="offer">Min 20% Off</p>
                    <p class="brand">HP, Dell, Asus</p>
                </div>
            </div>
        </section>
    </main>

</body>
</html>
